<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="2.css">
    <title>Level 2 Table</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th colspan="2">Subject</th>
                <th>John Doe</th>
                <th>Miriam Luther</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Biology</td>
                <td class="left">Practical</td>
                <td>A</td>
                <td>A</td>
            </tr>
            <tr>
                <td class="left">Theory</td>
                <td>A+</td>
                <td>A</td>
            </tr>
            <tr>
                <td rowspan="2">Chemistry</td>
                <td class="left">Practical</td>
                <td>B</td>
                <td>C</td>
            </tr>
            <tr>
                <td class="left">Theory</td>
                <td>A</td>
                <td>C+</td>
            </tr>
            <tr>
                <td rowspan="2">Physics</td>
                <td class="left">Practical</td>
                <td>A</td>
                <td>A</td>
            </tr>
            <tr>
                <td class="left">Theory</td>
                <td>A-</td>
                <td>A-</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
