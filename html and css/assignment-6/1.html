<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="1.css">
    <title>Details</title>
</head>
<body>
    <div class="container">
        <p>Name</p>
        <div class="row">
            <div class="column">
                <div class="box"></div>
                <p class = "hint">First Name</p>
            </div>
            <div class="column">
                <div class="box"></div>
                <p class = "hint">Last Name</p>
            </div>
        </div>
        <div class="singleColumn">
            <br>
            <p>Phone</p>
            <div class="box"></div>
            <br>
            <p>Email</p>
            <div class="box"></div>
            <br>
            <p>Address</p>
            <div class="box"></div>
            <p class = "hint">Address1</p>
            <div class="box"></div>
            <p class = "hint">Address2</p>
        </div>
        <br>
        <div class="row">
            <div class="column">
                <div class="box"></div>
                <p class="hint">City</p>
            </div>

            <div class="column">
                <div class="box"></div>
                <p class="hint">State/Region/Province</p>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="column">
                <div class="box"></div>
                <p class="hint">Postal / Zip Code</p>
            </div>
            <div class="column">
                <div class="box"></div>
                <p class="hint">Country</p>
            </div>
        </div>
        <br>
        <div class="next">
            <span>Next</span>
        </div>
    </div>
</body>
</html>
